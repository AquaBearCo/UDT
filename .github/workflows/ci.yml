name: CI (disabled auto-run)

on:
  # Temporarily disabled automatic triggers; manual dispatch only
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [linux-x64-release, linux-x64-debug]
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset ${PRESET}
        env:
          PRESET: ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset build-${{ matrix.preset }}

  linux-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchains and ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
      - name: Build aarch64
        run: |
          cmake --preset linux-aarch64-release
          cmake --build --preset build-linux-aarch64-release
      - name: Build armv7hf
        run: |
          cmake --preset linux-armv7hf-release
          cmake --build --preset build-linux-armv7hf-release

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        preset: [win-x64-release, win-x64-debug]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset $env:PRESET
        env:
          PRESET: ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset build-${{ matrix.preset }}

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        preset: [macos-arm64-release]
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja
        run: brew install ninja || true
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset build-${{ matrix.preset }}

  linux-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure (Debug with sanitizers)
        env:
          CFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer"
          CXXFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer"
          LDFLAGS: "-fsanitize=address,undefined"
        run: cmake --preset linux-x64-debug
      - name: Build (Debug + ASan/UBSan)
        run: cmake --build --preset build-linux-x64-debug -j

  clang-tidy:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy and ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy ninja-build
      - name: Configure (export compile commands)
        run: cmake --preset linux-x64-debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Run clang-tidy on sources
        run: |
          SRC_LIST=$(find src -name "*.cpp")
          if [ -z "$SRC_LIST" ]; then exit 0; fi
          for f in $SRC_LIST; do
            echo "Running clang-tidy on $f"
            clang-tidy -p build/linux-x64-debug "$f" || true
          done
