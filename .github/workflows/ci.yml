name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [linux-x64-release, linux-x64-debug]
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset ${PRESET}
        env:
          PRESET: ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset build-${{ matrix.preset }}

  linux-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchains and ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
      - name: Build aarch64
        run: |
          cmake --preset linux-aarch64-release
          cmake --build --preset build-linux-aarch64-release
      - name: Build armv7hf
        run: |
          cmake --preset linux-armv7hf-release
          cmake --build --preset build-linux-armv7hf-release

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        preset: [win-x64-release, win-x64-debug]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset $env:PRESET
        env:
          PRESET: ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset build-${{ matrix.preset }}
